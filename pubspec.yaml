name: file_image_cropper
description: Fast JPEG, PNG, and WebP cropping with a customizable Flutter UI and multithreaded Rust engine.
version: 0.1.0
homepage: https://pub.dev/packages/file_image_cropper
repository: https://github.com/evgenyuliganets/file_image_cropper
issue_tracker: https://github.com/evgenyuliganets/file_image_cropper/issues

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

topics:
  - image
  - crop
  - resize
  - ffi
  - rust

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.0.0
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4
  native_toolchain_rust: ^1.0.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
