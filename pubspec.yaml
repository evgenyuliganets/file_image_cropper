name: file_image_cropper
description: Fast JPEG, PNG, and WebP cropping with a customizable Flutter UI and multithreaded Rust engine.
version: 0.3.1
homepage: https://pub.dev/packages/file_image_cropper
repository: https://github.com/evgenyuliganets/file_image_cropper
issue_tracker: https://github.com/evgenyuliganets/file_image_cropper/issues

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

topics:
  - image
  - crop
  - resize
  - ffi
  - rust

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.0.0
  crypto: ^3.0.7
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_rust: ^1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.evgenyuliganets.file_image_cropper
        pluginClass: FileImageCropperPlugin
      ios:
        pluginClass: FileImageCropperPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FileImageCropperPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: FileImageCropperPlugin
      windows:
        pluginClass: FileImageCropperPluginCApi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# This repository builds from source for local development. Applications that
# depend on the published package do not inherit dependency user-defines and
# use verified prebuilt libraries by default.
hooks:
  user_defines:
    file_image_cropper:
      build_from_source: true
