[package]
name = "file_image_cropper_native"
version = "0.3.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rayon = "1.12.0"
png = { version = "0.18.1", features = ["zlib-rs"] }
zune-jpeg = "=0.5.15"
jpeg-rusturbo = "=0.9.2"
webp = { version = "=0.3.1", default-features = false }

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
