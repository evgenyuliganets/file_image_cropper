name: Platform verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DART_DISABLE_ANALYTICS: true
  FLUTTER_VERSION: 3.44.6

jobs:
  desktop-smoke:
    name: ${{ matrix.platform }} smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            flutter_command: flutter build windows --debug
          - platform: Linux
            os: ubuntu-latest
            flutter_command: flutter build linux --debug
          - platform: macOS
            os: macos-latest
            flutter_command: flutter build macos --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -y &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.17.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Analyze Dart API
        if: runner.os == 'Linux'
        run: flutter analyze

      - name: Verify Rust formatting
        working-directory: native
        run: |
          rustup component add rustfmt --toolchain 1.97.1
          cargo fmt --all -- --check

      - name: Test native codecs
        working-directory: native
        run: cargo test --locked

      - name: Run Flutter widget and native FFI smoke tests
        run: flutter test

      - name: Validate pub.dev package
        if: runner.os == 'Linux'
        run: dart pub publish --dry-run

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build desktop example with prebuilt native library
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: ${{ matrix.flutter_command }}

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.17.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Android example with prebuilt native libraries
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: flutter build apk --debug

  ios-build:
    name: iOS builds
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.17.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build iOS device example with prebuilt native library
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: flutter build ios --debug --no-codesign

      - name: Build iOS simulator example with prebuilt native library
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: flutter build ios --simulator --debug
