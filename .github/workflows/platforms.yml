name: Platform verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DART_DISABLE_ANALYTICS: true
  FLUTTER_VERSION: 3.44.6

jobs:
  heic-fixture:
    name: Generate HEIC smoke fixture
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Encode the existing libpng-licensed fixture as HEIC
        run: |
          mkdir -p generated
          sips -s format heic native/tests/fixtures/png/pngtest.png \
            --out generated/system_test.heic
          test -s generated/system_test.heic

      - uses: actions/upload-artifact@v4
        with:
          name: generated-heic-fixture
          path: generated/system_test.heic
          if-no-files-found: error

  desktop-smoke:
    name: ${{ matrix.platform }} smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            flutter_command: flutter build windows --debug
          - platform: Linux
            os: ubuntu-latest
            flutter_command: flutter build linux --debug
          - platform: macOS
            os: macos-latest
            flutter_command: flutter build macos --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -y &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.17.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Analyze Dart API
        if: runner.os == 'Linux'
        run: flutter analyze

      - name: Verify Rust formatting
        working-directory: native
        run: |
          rustup component add rustfmt --toolchain 1.97.1
          cargo fmt --all -- --check

      - name: Test native codecs
        working-directory: native
        run: cargo test --locked

      - name: Run Flutter widget and native FFI smoke tests
        run: flutter test

      - name: Validate pub.dev package
        if: runner.os == 'Linux'
        run: dart pub publish --dry-run

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build desktop example with prebuilt native library
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: ${{ matrix.flutter_command }}

  android-build:
    name: Android build and emulator smoke
    needs: heic-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-heic-fixture
          path: example/assets/heic

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.17.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Android example with prebuilt native libraries
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native crop smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            cd example && flutter test
            integration_test/native_crop_smoke_test.dart
            --dart-define=FILE_IMAGE_CROPPER_HEIC_SMOKE=true
            -d emulator-5554

  ios-build:
    name: iOS builds and simulator smoke
    needs: heic-fixture
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-heic-fixture
          path: example/assets/heic

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.17.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build iOS device example with prebuilt native library
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: flutter build ios --debug --no-codesign

      - name: Build iOS simulator example with prebuilt native library
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: flutter build ios --simulator --debug

      - name: Run native crop smoke on iOS simulator
        working-directory: example
        env:
          RUSTUP_TOOLCHAIN: prebuilt-assets-must-not-use-rust
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter test integration_test/native_crop_smoke_test.dart \
            --dart-define=FILE_IMAGE_CROPPER_HEIC_SMOKE=true \
            -d "$DEVICE_ID"
